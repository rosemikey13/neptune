- name: Wait for server to be ready
  hosts: giteaDB
  gather_facts: false
  vars:
    ansible_connection: local
  tasks:
    - name: Wait for ssh port open
      ansible.builtin.wait_for:
        port: 22
        delay: 15
        timeout: 75
        search_regex: OpenSSH
        host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'

- name: Download apt packages
  hosts: giteaDB
  tasks:
    - name: Install prerequisite tools
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 4000
        name:
          - "curl"
          - "acl"
          - "ca-certificates"
          - "libpq-dev"
          - "python3-pip"
          - "python3-venv"
          - "python3-setuptools"
      become: yes
    
    - name: Initialize postgres repo
      ansible.builtin.command:
        cmd: install -d /usr/share/postgresql-common/pgdg
      become: yes

    - name: Get postgres repo files
      ansible.builtin.command:
        cmd: curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
      become: yes

    - name: Copy repo config file
      ansible.builtin.copy:
        src: misc/pgdg.sources
        dest: /etc/apt/sources.list.d/pgdg.sources
      become: yes

    - name: Install Postgres 16
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 4000
        name:
          - "postgresql-16"
      become: yes

- name: Configure Postgres
  hosts: giteaDB
  vars_files:
    - db_vars.yaml
  tasks:
    - name: Configure Postgres listen addresses
      ansible.builtin.lineinfile:
        line: listen_addresses = '*'
        search_string: listen_addresses
        path: /etc/postgresql/16/main/postgresql.conf
      become: yes
    
    - name: Configure Postgres listen addresses
      ansible.builtin.lineinfile:
        line: password_encryption = scram-sha-256
        search_string: password_encryption
        path: /etc/postgresql/16/main/postgresql.conf
      become: yes
    
    - name: Add Postgres connection info
      ansible.builtin.lineinfile:
        line: "host {{DB_NAME}} {{DB_USER}} {{APP_IP}} scram-sha-256"
        insertbefore: host
        path: /etc/postgresql/16/main/pg_hba.conf
      become: yes

    - name: restart Postgres
      ansible.builtin.service:
        enabled: true
        name: postgresql
        state: restarted
      become: yes
    
    - name: Install python dependencies
      ansible.builtin.pip:
        name: "psycopg2-binary"
        virtualenv: /opt/gitea/venv
        virtualenv_command: "python3 -m venv"
      become: yes
    
    - name: Create DB User
      become: yes
      become_user: postgres
      vars:
        ansible_python_interpreter: /opt/gitea/venv/bin/python3
      community.postgresql.postgresql_user:
        name: "{{DB_USER}}"
        password: "{{DB_PASSWORD}}"
    
    - name: Initialize DB
      become: yes
      become_user: postgres
      vars:
        ansible_python_interpreter: /opt/gitea/venv/bin/python3
      community.postgresql.postgresql_db:
        owner: "{{DB_USER}}"
        name: "{{DB_NAME}}"
        encoding: UTF8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
        template: template0
    
    - name: Grant DB User permissions on gitea DB
      become: yes
      become_user: postgres
      vars:
        ansible_python_interpreter: /opt/gitea/venv/bin/python3
      community.postgresql.postgresql_privs:
        login_db: "{{DB_NAME}}"
        roles: "{{DB_USER}}"
        privs: "ALL"
        type: "database"